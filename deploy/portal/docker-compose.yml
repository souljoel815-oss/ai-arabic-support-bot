# Local dev stack for 010-website-portal.
# Brings up:
#   - portal-web:  the ASP.NET Core process on :5050
#   - sqlserver:   SQL Server 2022 on :1433 (DaftarXPortal database)
#   - azurite:     Azure Blob emulator on :10000 (for ticket attachments + invoice PDFs)
#
# Usage from repo root:
#   docker compose -f deploy/portal/docker-compose.yml up -d
#   docker compose -f deploy/portal/docker-compose.yml logs -f portal-web

name: daftarx-portal-dev

services:
  portal-web:
    build:
      context: ../..
      dockerfile: deploy/portal/Dockerfile
    image: daftarx-portal-web:dev
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PortalDb=Server=sqlserver,1433;Database=DaftarXPortal;User Id=sa;Password=Daftarx_local_DEV_password_1!;Encrypt=False;TrustServerCertificate=True;
      - PortalDbProvider=SqlServer
      - AzureBlob__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Daftarx_local_DEV_password_1!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - portal-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Daftarx_local_DEV_password_1!", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 12

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000"
    volumes:
      - portal-blob-data:/data

volumes:
  portal-sql-data:
  portal-blob-data:
