# android/gradle/wrapper/gradle-wrapper.properties — T001 per specs/009-android-app/tasks.md
#
# Pinned Gradle version for reproducible builds. The gradle-wrapper.jar
# itself is NOT checked in by this skill (binary blob); the dev runs
# `gradle wrapper --gradle-version 8.10.2` once to generate it, or
# Android Studio does it automatically on first sync. See android/README.md.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
