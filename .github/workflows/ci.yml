name: EgyptTax CI

on:
  push:
    branches:
      - "008-egypt-tax-accounting"
      - "main"
    paths:
      - "src/EgyptTax.**"
      - "tests/EgyptTax.**"
      - "Directory.Packages.props"
      - "src/Directory.Build.props"
      - "EgyptTax.sln"
      - ".config/dotnet-tools.json"
      - "specs/008-egypt-tax-accounting/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/EgyptTax.**"
      - "tests/EgyptTax.**"
      - "Directory.Packages.props"
      - "src/Directory.Build.props"
      - "EgyptTax.sln"
      - "specs/008-egypt-tax-accounting/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    name: Build + test (Windows / .NET 8)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: csharpier format check (T259 guard)
        run: dotnet csharpier --check src/ tests/

      - name: Restore
        run: dotnet restore EgyptTax.sln

      - name: Build (Release)
        run: dotnet build EgyptTax.sln -c Release --no-restore /warnaserror

      - name: Unit tests
        run: dotnet test tests/EgyptTax.UnitTests/EgyptTax.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --collect:"XPlat Code Coverage"

      - name: Contract tests
        run: dotnet test tests/EgyptTax.ContractTests/EgyptTax.ContractTests.csproj -c Release --no-build --logger "trx;LogFileName=contract.trx" --collect:"XPlat Code Coverage"

      - name: Integration tests (Testcontainers requires Docker)
        run: dotnet test tests/EgyptTax.IntegrationTests/EgyptTax.IntegrationTests.csproj -c Release --no-build --logger "trx;LogFileName=integration.trx" --collect:"XPlat Code Coverage"

      - name: Install Playwright browsers
        run: pwsh tests/EgyptTax.E2ETests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: E2E tests
        run: dotnet test tests/EgyptTax.E2ETests/EgyptTax.E2ETests.csproj -c Release --no-build --logger "trx;LogFileName=e2e.trx"

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-results
          path: "**/*.trx"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage.cobertura.xml"

  build-installer:
    name: WiX MSI installer (release branch only)
    runs-on: windows-2022
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish EgyptTax.Web
        # The published output feeds the WiX <Files> harvest in
        # src/EgyptTax.Installer/Product.wxs via the
        # HarvestPublishDir property below.
        run: dotnet publish src/EgyptTax.Web/EgyptTax.Web.csproj -c Release -r win-x64 --self-contained false -o ${{ github.workspace }}/publish

      - name: Build MSI (via wixproj — WiX SDK + Firewall.wixext restored automatically)
        # T247-followup — wixproj's <Files> element auto-harvests
        # the publish output at build time; no separate `wix harvest`
        # step needed. WixToolset.Sdk + WixToolset.Firewall.wixext
        # are restored by `dotnet build` from NuGet. The property is
        # HarvestPublishDir (NOT MSBuild's default PublishDir, which
        # would clash with the SDK's own publish-output directory —
        # see the wixproj's PropertyGroup).
        run: dotnet build src/EgyptTax.Installer/EgyptTax.Installer.wixproj -c Release -p:HarvestPublishDir=${{ github.workspace }}/publish

      - name: Upload MSI artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EgyptTax-Setup-msi
          path: src/EgyptTax.Installer/bin/Release/EgyptTax.Installer.msi
