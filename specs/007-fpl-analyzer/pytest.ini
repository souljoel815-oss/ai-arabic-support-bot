[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    contract: stable interface contracts (CLI, package API, FPL API, diagnostics)
    integration: end-to-end user-story flows
    unit: isolated module / invariant tests
filterwarnings =
    ignore::DeprecationWarning:pandas.*
    ignore::DeprecationWarning:streamlit.*
